<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d776e">
  <title>Careflow — Hospital Management Demo</title>
  <style>
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --ink: #172c39;
  --muted: #7a8991;
  --line: #e8edef;
  --teal: #128c80;
  --teal-dark: #09695f;
  --teal-soft: #e7f5f1;
  --amber: #c98239;
  --amber-soft: #fff3e5;
  --blue: #6687c4;
  --blue-soft: #edf2fc;
  --red: #cb6469;
  --red-soft: #fff0f0;
  --radius: 18px;
  --shadow: 0 4px 24px rgba(30, 57, 68, .035);
  --sidebar: 238px;
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  font-weight: 400;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button, input, select, textarea { outline: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #71c5b8; outline-offset: 3px; }
button:disabled { cursor: not-allowed; opacity: .45; }
button { color: inherit; }
a { color: var(--teal); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; }
svg { flex-shrink: 0; }
.icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
.muted, .text-muted { color: var(--muted); }
.text-teal { color: var(--teal); }
.text-right { text-align: right; }
.text-center { text-align: center; }
.nowrap { white-space: nowrap; }
.hidden, [hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; flex-direction: column; width: var(--sidebar); padding: 30px 20px 19px; background: #fff; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 40px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 39px; height: 39px; border-radius: 12px; background: var(--teal); color: #fff; display: grid; place-items: center; box-shadow: 0 5px 12px #128c8018; }
.brand-mark .icon { width: 24px; height: 24px; }
.brand-title { display: block; font-weight: 750; font-size: 22px; letter-spacing: -.8px; line-height: 1.1; }
.brand-subtitle { display: block; font-size: 9px; color: #82969a; letter-spacing: 1.9px; text-transform: uppercase; margin-top: 5px; font-weight: 650; }
.nav-group-title { margin: 26px 14px 12px; font-size: 10px; font-weight: 700; color: #9ba7ab; letter-spacing: 1.7px; text-transform: uppercase; }
.nav-group-title:first-child { margin-top: 0; }
.sidebar nav { flex: 1; overflow-y: auto; scrollbar-width: thin; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 5px 0; border: 0; border-radius: 10px; background: transparent; color: #72848c; font-size: 13px; font-weight: 550; text-align: left; transition: color .15s, background .15s; }
.nav-item .icon { width: 18px; height: 18px; }
.nav-item:hover { color: var(--teal-dark); background: #f4f8f7; }
.nav-item.active { color: var(--teal-dark); background: #eaf5f1; font-weight: 700; }
.nav-count { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: 5px; background: #daeae5; color: var(--teal-dark); font-size: 10px; text-align: center; }
.sidebar-footer { border-top: 1px solid var(--line); margin: 18px 2px 0; padding: 18px 8px 0; }
.sidebar-footer p { font-size: 11px; color: var(--muted); }
.sidebar-footer .person { gap: 10px; }
.sidebar-footer .person-name { font-size: 12px; }
.sidebar-footer .person-meta { font-size: 10px; }
.sidebar-help { border: 1px solid #e7efec; border-radius: 13px; background: #f6f9f7; padding: 15px; margin-bottom: 22px; font-size: 11px; color: #6e8580; }
.sidebar-help strong { display: block; color: var(--ink); margin: 7px 0 4px; font-size: 12px; }
.sidebar-help .btn { margin-top: 12px; width: 100%; font-size: 11px; min-height: 33px; }
.shell { margin-left: var(--sidebar); min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 20; min-height: 77px; padding: 17px 34px; display: flex; align-items: center; justify-content: space-between; gap: 18px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
.breadcrumb { display: flex; align-items: center; gap: 11px; color: #89969c; font-size: 12px; }
.breadcrumb strong, .breadcrumb .current { color: #405663; font-weight: 600; }
.breadcrumb .icon { width: 15px; height: 15px; }
.topbar-actions { display: flex; align-items: center; gap: 13px; position: relative; }
.demo-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid #e1e9e5; background: #f7faf7; color: #618575; font-size: 10px; font-weight: 650; letter-spacing: .2px; border-radius: 6px; white-space: nowrap; }
.demo-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #77a38b; }
.role-select { background: #fff; border: 1px solid var(--line); border-radius: 8px; min-height: 35px; padding: 5px 25px 5px 10px; color: #647883; font-size: 11px; }
.icon-button { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #70818a; position: relative; }
.icon-button:hover { background: var(--teal-soft); color: var(--teal); }
.icon-button .icon { width: 17px; height: 17px; }
.notification-dot { position: absolute; top: 6px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #d78e65; border: 1px solid #fff; }
.avatar { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 35px; height: 35px; border-radius: 50%; background: #e8efeb; color: #56806b; font-size: 11px; font-weight: 650; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.blue { background: #e9eef8; color: #778fb8; }
.avatar.amber { background: #f9eee2; color: #b58e65; }
.avatar.purple { background: #eeebf7; color: #9b8cbd; }
.avatar.teal { background: #e5f1ee; color: #68a194; }
.avatar.pink { background: #f5eaf0; color: #be8ca7; }
.avatar.lg { width: 53px; height: 53px; font-size: 16px; border-radius: 15px; }
.main { max-width: 1800px; margin: 0 auto; padding: 30px 34px 26px; }
.page-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 25px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: 1.7px; text-transform: uppercase; margin-bottom: 9px; }
h1 { font-size: 29px; font-weight: 650; letter-spacing: -1.1px; }
.page-heading p, .page-subtitle { margin-top: 8px; color: var(--muted); font-size: 12px; }
.page-actions { display: flex; align-items: center; gap: 9px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; border: 1px solid transparent; border-radius: 9px; padding: 9px 15px; font-size: 11px; font-weight: 600; white-space: nowrap; text-decoration: none; transition: background .15s, box-shadow .15s, transform .15s; }
.btn .icon { width: 15px; height: 15px; }
.btn:active { transform: translateY(1px); }
.btn-primary { color: #fff; background: var(--teal); border-color: var(--teal); box-shadow: 0 3px 6px #128c8012; }
.btn-primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
.btn-secondary { color: #506570; border-color: #dfe7e8; background: #fff; }
.btn-secondary:hover { border-color: #a8cbc4; background: #fbfdfc; }
.btn-ghost { color: var(--teal); background: transparent; }
.btn-ghost:hover { background: var(--teal-soft); }
.btn-danger { color: #b94f59; background: var(--red-soft); border-color: #f7dcde; }
.btn-sm { min-height: 30px; padding: 5px 9px; font-size: 10px; border-radius: 7px; gap: 5px; }
.btn-sm .icon { width: 13px; height: 13px; }
.welcome-banner { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 172px; background: #e8f2ef; border: 1px solid #dcebe5; border-radius: var(--radius); padding: 27px 30px; margin-bottom: 23px; }
.welcome-copy { position: relative; z-index: 2; max-width: 68%; }
.welcome-copy h2 { font-size: 24px; font-weight: 600; letter-spacing: -.75px; color: #24584e; }
.welcome-copy p { color: #75928a; font-size: 12px; margin-top: 10px; max-width: 490px; line-height: 1.75; }
.welcome-copy .pill { margin-bottom: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; background: #d7e8df; padding: 4px 8px; color: #5b8b73; text-transform: uppercase; letter-spacing: 1px; font-size: 8px; font-weight: 700; }
.pill .icon { width: 12px; height: 12px; }
.welcome-art { align-self: stretch; position: relative; width: 260px; min-width: 150px; display: flex; justify-content: center; align-items: center; margin: -20px 8px -27px 0; color: #82b4a6; }
.welcome-art::before { content: ''; position: absolute; width: 188px; height: 188px; background: #d6e8e1; border-radius: 50%; bottom: -22px; right: 25px; }
.welcome-art::after { content: '+'; position: absolute; top: 16px; right: 4px; color: #a8cfc1; font-size: 42px; font-weight: 300; }
.welcome-art > svg { position: relative; z-index: 1; width: 210px; height: 160px; }
.banner-note { display: flex; align-items: center; gap: 6px; margin-top: 15px; font-size: 10px; color: #6e9589; }
.banner-note .icon { width: 12px; height: 12px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 25px; }
.stat-card { position: relative; padding: 21px 22px 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
.stat-card .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat-icon { display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 10px; color: var(--teal); background: var(--teal-soft); }
.stat-icon .icon { width: 18px; height: 18px; }
.stat-icon.blue { background: var(--blue-soft); color: var(--blue); }
.stat-icon.amber { background: var(--amber-soft); color: var(--amber); }
.stat-icon.purple { background: #f1edfa; color: #9a87c1; }
.stat-label { color: #849199; font-size: 11px; font-weight: 500; }
.stat-value { font-size: 29px; letter-spacing: -1px; font-weight: 650; line-height: 1.25; margin-top: 11px; }
.stat-foot { display: flex; align-items: center; gap: 5px; color: #9ba5a9; font-size: 9px; margin-top: 11px; }
.stat-foot strong { color: #68a18a; font-weight: 650; }
.stat-foot .icon { width: 12px; height: 12px; }
.stat-sparkline { position: absolute; right: 20px; bottom: 23px; width: 73px; height: 28px; opacity: .6; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr); gap: 23px; align-items: start; }
.dashboard-column { display: grid; gap: 23px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card + .card { margin-top: 23px; }
.dashboard-column > .card + .card { margin-top: 0; }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 21px 22px 18px; }
.card-title { font-size: 14px; font-weight: 650; letter-spacing: -.2px; }
.card-subtitle { font-size: 10px; color: #94a0a6; margin-top: 5px; }
.card-body { padding: 0 22px 22px; }
.card-header + .card-body { padding-top: 3px; }
.card-actions { display: flex; align-items: center; gap: 8px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
th { text-align: left; color: #929fa5; background: #fafbfc; font-size: 9px; letter-spacing: .6px; text-transform: uppercase; font-weight: 600; padding: 12px 18px; border-top: 1px solid #eff2f3; border-bottom: 1px solid #eff2f3; }
td { padding: 15px 18px; color: #73848c; border-bottom: 1px solid #f0f3f4; font-size: 10px; }
th:first-child, td:first-child { padding-left: 22px; }
th:last-child, td:last-child { padding-right: 22px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fcfdfd; }
td strong { color: #495f6b; font-weight: 550; }
.person { display: flex; align-items: center; gap: 10px; }
.person-name { color: #38505e; font-size: 11px; font-weight: 600; }
.person-meta { color: #9ba6ac; font-size: 9px; margin-top: 3px; }
.table-footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-top: 1px solid #f1f3f4; font-size: 10px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 9px; line-height: 1.3; border-radius: 5px; background: #f0f3f5; color: #7b8c95; font-weight: 500; white-space: nowrap; }
.badge::before { content: ''; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
.badge.teal, .badge.success, .badge.confirmed, .badge.paid, .badge.available { color: #5d9d86; background: #eaf5ee; }
.badge.amber, .badge.pending, .badge.waiting { color: #c99d5f; background: #fff6e8; }
.badge.blue, .badge.scheduled { color: #7596c5; background: #eef3fd; }
.badge.red, .badge.cancelled, .badge.low { color: #c98083; background: #fff0f1; }
.badge.gray, .badge.completed { color: #87969e; background: #f0f3f5; }
.badge.purple { color: #9e8bb9; background: #f3effa; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.search-field { display: flex; align-items: center; gap: 9px; min-height: 41px; min-width: 210px; max-width: 360px; flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 0 13px; color: #9aa8af; }
.search-field .icon { width: 17px; height: 17px; }
.search-field input { width: 100%; min-width: 0; padding: 10px 0; border: 0; background: transparent; color: var(--ink); font-size: 12px; }
.search-field input:focus-visible { outline: none; }
.search-field:focus-within { border-color: #76bbae; box-shadow: 0 0 0 3px #128c800d; }
input::placeholder, textarea::placeholder { color: #a7b1b7; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters select, .filter-select { background: #fff; border: 1px solid var(--line); border-radius: 9px; min-height: 40px; color: #6f818a; font-size: 11px; padding: 7px 27px 7px 12px; }
.empty-state { padding: 55px 25px; text-align: center; color: var(--muted); }
.empty-state .icon { width: 35px; height: 35px; color: #a2c1b8; margin-bottom: 14px; }
.empty-state h3 { color: #4a6570; font-size: 16px; margin-bottom: 7px; }
.empty-state p { font-size: 12px; }
.doctor-list { display: grid; }
.doctor-row { display: flex; align-items: center; gap: 11px; padding: 13px 0; border-bottom: 1px solid #eff3f3; }
.doctor-row:first-child { padding-top: 2px; }
.doctor-row:last-child { border-bottom: 0; padding-bottom: 0; }
.doctor-avatar { width: 36px; height: 36px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: #e9f1ed; color: #779f8d; border-radius: 10px; flex-shrink: 0; }
.doctor-row > .badge, .doctor-row > .doctor-status { margin-left: auto; font-size: 8px; }
.doctor-info { flex: 1; min-width: 0; }
.doctor-info h4 { font-size: 11px; font-weight: 600; }
.doctor-info p { font-size: 9px; color: #94a3ab; margin-top: 4px; }
.activity-list { display: grid; }
.activity-row { position: relative; display: flex; gap: 11px; padding: 11px 0; }
.activity-row:not(:last-child)::before { content: ''; position: absolute; left: 12px; width: 1px; top: 34px; bottom: -8px; background: #edf1ef; }
.activity-dot { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 26px; height: 26px; background: var(--teal-soft); color: #75a895; border-radius: 8px; }
.activity-dot .icon { width: 13px; height: 13px; }
.activity-dot.amber { color: #c69d66; background: var(--amber-soft); }
.activity-dot.blue { color: var(--blue); background: var(--blue-soft); }
.activity-row p { font-size: 10px; color: #7c8d95; line-height: 1.6; }
.activity-row p strong { color: #506671; font-weight: 550; }
.activity-row small { color: #acb4b9; font-size: 9px; display: block; margin-top: 2px; }
.progress-row { margin-top: 19px; }
.progress-label { display: flex; justify-content: space-between; font-size: 10px; color: #7d9097; margin-bottom: 9px; }
.progress-label strong { font-weight: 550; color: #526c77; }
.progress-track { height: 5px; overflow: hidden; border-radius: 4px; background: #f0f4f3; }
.progress-fill { height: 100%; border-radius: inherit; background: #83b5a7; }
.progress-fill.blue { background: #8ca9ce; }
.progress-fill.amber { background: #d8b081; }
.quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.quick-action { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 8px; background: #fff; border: 1px solid var(--line); border-radius: 11px; color: #6c828a; font-size: 10px; transition: all .15s; }
.quick-action .icon { width: 20px; height: 20px; color: #6ea996; }
.quick-action:hover { color: var(--teal); border-color: #a3cbc0; background: #f9fcfb; transform: translateY(-2px); }
.patient-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.patient-card { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 22px; box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s; }
.patient-card:hover { border-color: #bdd8d0; box-shadow: 0 6px 22px #133e2a08; }
.patient-top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.patient-top > .badge, .patient-top > .icon-button { margin-left: auto; }
.patient-card h3 { font-size: 14px; font-weight: 600; }
.patient-card .person-meta { font-size: 10px; }
.patient-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; border-top: 1px solid #f0f3f3; padding-top: 16px; margin-bottom: 18px; }
.patient-meta span { display: block; font-size: 10px; color: #98a6ac; margin-bottom: 4px; }
.patient-meta strong { font-size: 12px; font-weight: 500; color: #526b77; }
.patient-card .btn { width: 100%; }
.two-column { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 23px; align-items: start; }
.three-column { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.two-column > .card + .card, .three-column > .card + .card { margin-top: 0; }
.record-card { padding: 20px 22px; border: 1px solid var(--line); background: #fff; border-radius: 14px; margin-bottom: 15px; }
.record-card h3 { font-size: 14px; margin-bottom: 8px; }
.record-card p { font-size: 12px; color: #7b8f97; line-height: 1.75; }
.timeline { padding-left: 7px; }
.timeline-item { position: relative; border-left: 1px solid #ddeae6; padding: 0 0 26px 23px; }
.timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
.timeline-item::before { content: ''; position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 3px solid #e6f1ed; background: var(--teal); top: 2px; left: -8px; }
.timeline-item h4 { font-size: 12px; margin-bottom: 5px; }
.timeline-item p { font-size: 11px; color: var(--muted); }
.timeline-item small { display: block; font-size: 9px; color: #a0adb2; margin-top: 6px; }
.invoice-total { display: flex; justify-content: space-between; align-items: center; background: #f0f7f4; border-radius: 10px; padding: 16px 18px; color: #4e7a6f; margin-top: 20px; font-size: 13px; }
.invoice-total strong { color: var(--teal-dark); font-size: 24px; font-weight: 650; }
.inventory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.inventory-card { border: 1px solid var(--line); border-radius: 15px; padding: 21px; background: #fff; }
.inventory-card h3 { font-size: 14px; margin-bottom: 6px; }
.inventory-card p { color: var(--muted); font-size: 11px; }
.inventory-card .stock-count { font-size: 28px; font-weight: 650; letter-spacing: -.7px; margin: 15px 0 10px; }
.inventory-card .stock-count small { font-size: 11px; color: #9ba6ad; letter-spacing: 0; font-weight: 400; }
.inventory-card .btn { width: 100%; margin-top: 18px; }

.modal-backdrop { position: fixed; inset: 0; background: #122e3b59; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; animation: fade-in .15s ease; }
.modal { background: #fff; width: 100%; max-width: 680px; max-height: calc(100dvh - 48px); overflow-y: auto; border-radius: 22px; box-shadow: 0 24px 90px #0e29312b; animation: modal-in .2s ease; }
.modal.wide { max-width: 850px; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 26px 28px 21px; border-bottom: 1px solid var(--line); }

    catch (error) { throw new Error('Could not read saved demo data. Allow browser storage and reload.'); }
    if (saved) {
      try { current = JSON.parse(saved); }
      catch (error) { throw new Error('Saved demo data is invalid. Clear this site’s demo storage and reload.'); }
      var keys = ['patients', 'doctors', 'appointments', 'records', 'labs', 'inventory', 'invoices', 'audit', 'notifications'];
      if (!current || current.version !== 1 || ROLES.indexOf(current.role) === -1 || keys.some(function (key) { return !Array.isArray(current[key]); }) || !current.patients.some(function (p) { return p.id === current.patientId; })) throw new Error('Saved demo data is incompatible. Clear this site’s demo storage and reload.');
    } else {
      current = seed();
      persist(current);
    }

    function can(action) {
      return ACTIONS.indexOf(action) !== -1 && (current.role === 'Administrator' || SHARED_ACTIONS.indexOf(action) !== -1 || (PERMISSIONS[current.role] || []).indexOf(action) !== -1);
    }
    function allowed(action) { if (!can(action)) throw new Error(current.role + ' cannot perform this action. Switch to an authorized demo role.'); }
    function find(state, collection, entityId) {
      var entity = state[collection].find(function (item) { return item.id === entityId; });
      if (!entity) throw new Error('The selected ' + ({ patients: 'patient', doctors: 'doctor', appointments: 'appointment', labs: 'lab order', inventory: 'inventory item', invoices: 'invoice' }[collection] || 'item') + ' was not found.');
      return entity;
    }
    function ownPatient(patientId) { if (current.role === 'Patient' && patientId !== current.patientId) throw new Error('Patients can only manage their own appointments.'); }
    function notify(state, title, detail) { state.notifications.unshift({ id: id('n'), time: new Date().toISOString(), title: title, detail: detail, read: false }); }
    function commit(action, description, change) {
      allowed(action);
      var next = copy(current);
      var result = change(next);
      next.audit.unshift({ id: id('log'), time: new Date().toISOString(), role: next.role, action: typeof description === 'function' ? description(result) : description });
      persist(next);
      current = next;
      return copy(result === undefined ? next : result);
    }
    function checkSlot(state, appointment, excludedId) {
      find(state, 'patients', appointment.patientId);
      find(state, 'doctors', appointment.doctorId);
      validDate(appointment.date);
      if (appointment.date < today()) throw new Error('Appointments cannot be booked or rescheduled in the past.');
      if (typeof appointment.time !== 'string' || !/^([01]\d|2[0-3]):[0-5]\d$/.test(appointment.time)) throw new Error('Choose a valid appointment time.');
      var conflicts = state.appointments.filter(function (a) { return a.id !== excludedId && live(a) && a.date === appointment.date && a.time === appointment.time; });
      if (conflicts.some(function (a) { return a.doctorId === appointment.doctorId; })) throw new Error('This doctor is already booked at that time. Choose another slot.');
      if (conflicts.some(function (a) { return a.patientId === appointment.patientId; })) throw new Error('This patient already has an appointment at that time.');
    }

    return {
      get state() { return copy(current); },
      can: can,
      today: today,
      setRole: function (role) {
        if (ROLES.indexOf(role) === -1) throw new Error('Choose a valid demo role.');
        return commit('setRole', 'Switched demo role to ' + role + '.', function (state) { state.role = role; return { role: role, patientId: state.patientId }; });
      },
      addPatient: function (data) {
        data = data || {};
        return commit('addPatient', function (p) { return 'Registered patient ' + p.name + '.'; }, function (state) {
          var name = text(data.name, 'Patient name', true, 100).replace(/\s+/g, ' ');
          if (data.age === '' || data.age === null || data.age === undefined || !Number.isInteger(Number(data.age)) || Number(data.age) < 0 || Number(data.age) > 130) throw new Error('Enter an age between 0 and 130.');
          var phone = phoneNumber(data.phone);
          if (state.patients.some(function (p) { return p.name.toLocaleLowerCase() === name.toLocaleLowerCase() && p.phone === phone; })) throw new Error('A patient with this name and phone number is already registered.');
          if (['Male', 'Female', 'Other', 'Prefer not to say'].indexOf(data.gender) === -1) throw new Error('Choose a valid gender.');
          var blood = data.blood || 'Unknown';
          if (['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-', 'Unknown'].indexOf(blood) === -1) throw new Error('Choose a valid blood group.');
          var patient = { id: id('p'), name: name, age: Number(data.age), gender: data.gender, phone: phone, blood: blood, history: text(data.history, 'Medical history', false) };
          state.patients.push(patient);
          notify(state, 'Patient registered', patient.name + ' is ready to book an appointment.');
          return patient;
        });
      },
      bookAppointment: function (data) {
        data = data || {};
        return commit('bookAppointment', 'Booked an appointment.', function (state) {
          ownPatient(data.patientId);
          var appointment = { id: id('a'), patientId: data.patientId, doctorId: data.doctorId, date: data.date, time: data.time, status: 'Confirmed', reason: text(data.reason, 'Visit reason', true, 500) };
          checkSlot(state, appointment);
          state.appointments.push(appointment);
          notify(state, 'Appointment confirmed', find(state, 'patients', appointment.patientId).name + ' · ' + appointment.date + ' at ' + appointment.time + '.');
          return appointment;
        });
      },
      rescheduleAppointment: function (appointmentId, data) {
        data = data || {};
        return commit('rescheduleAppointment', 'Rescheduled an appointment.', function (state) {
          var appointment = find(state, 'appointments', appointmentId);
          ownPatient(appointment.patientId);
          if (!live(appointment)) throw new Error('Completed or cancelled appointments cannot be rescheduled. Book a new appointment.');
          appointment.date = data.date === undefined ? appointment.date : data.date;
          appointment.time = data.time === undefined ? appointment.time : data.time;
          appointment.doctorId = data.doctorId === undefined ? appointment.doctorId : data.doctorId;
          checkSlot(state, appointment, appointmentId);
          appointment.status = 'Confirmed';
          notify(state, 'Appointment rescheduled', find(state, 'patients', appointment.patientId).name + ' · ' + appointment.date + ' at ' + appointment.time + '.');
          return appointment;
        });
      },
      setAppointmentStatus: function (appointmentId, status) {
        return commit('setAppointmentStatus', 'Updated appointment status to ' + status + '.', function (state) {
          var appointment = find(state, 'appointments', appointmentId);
          ownPatient(appointment.patientId);
          if (APPOINTMENT_STATUSES.indexOf(status) === -1) throw new Error('Choose a valid appointment status.');
          if (current.role === 'Patient' && status !== 'Cancelled') throw new Error('Patients may only cancel their own appointments.');
          if (!live(appointment) && appointment.status !== status) throw new Error('Completed or cancelled appointments cannot be changed. Book a new appointment.');
          appointment.status = status;
          notify(state, 'Appointment ' + status.toLowerCase(), find(state, 'patients', appointment.patientId).name + ' · ' + appointment.date + ' at ' + appointment.time + '.');
          return appointment;
        });
      },
      addRecord: function (data) {
        data = data || {};
        return commit('addRecord', 'Added a medical record.', function (state) {
          find(state, 'patients', data.patientId);
          find(state, 'doctors', data.doctorId);
          var record = { id: id('r'), patientId: data.patientId, doctorId: data.doctorId, date: validDate(data.date || today()), diagnosis: text(data.diagnosis, 'Diagnosis / assessment', true), treatment: text(data.treatment, 'Treatment notes', true), prescription: text(data.prescription, 'Prescription notes', false) };
          if (record.date > today()) throw new Error('Medical records cannot be dated in the future.');
          state.records.unshift(record);
          notify(state, 'Medical record added', find(state, 'patients', record.patientId).name + ' has a new visit record.');
          return record;
        });
      },
      orderLab: function (data) {
        data = data || {};
        return commit('orderLab', 'Ordered a laboratory test.', function (state) {
          find(state, 'patients', data.patientId);
          var lab = { id: id('l'), patientId: data.patientId, test: text(data.test, 'Test name', true, 200), orderedAt: today(), status: 'Pending', result: '' };
          state.labs.unshift(lab);
          notify(state, 'Lab test ordered', lab.test + ' · ' + find(state, 'patients', lab.patientId).name + '.');
          return lab;
        });
      },
      completeLab: function (labId, result) {
        return commit('completeLab', 'Completed a laboratory report.', function (state) {
          var lab = find(state, 'labs', labId);
          if (lab.status === 'Completed') throw new Error('This lab report is already completed.');
          lab.result = text(result, 'Lab result', true, 4000);
          lab.status = 'Completed';
          notify(state, 'Lab report ready', lab.test + ' · ' + find(state, 'patients', lab.patientId).name + '.');
          return lab;
        });
      },
      adjustStock: function (itemId, delta) {
        return commit('adjustStock', 'Adjusted inventory stock.', function (state) {
          var item = find(state, 'inventory', itemId);
          if (delta === '' || delta === null || delta === undefined || !Number.isSafeInteger(Number(delta)) || Number(delta) === 0) throw new Error('Enter a non-zero whole-number stock adjustment.');
          var stock = item.stock + Number(delta);
          if (stock < 0 || !Number.isSafeInteger(stock)) throw new Error('Stock cannot be negative or exceed the supported limit.');
          item.stock = stock;
          if (item.stock <= item.threshold) notify(state, 'Low stock alert', item.name + ': ' + item.stock + ' remaining (reorder threshold ' + item.threshold + ').');
          return item;
        });
      },
      createInvoice: function (data) {
        data = data || {};
        return commit('createInvoice', 'Created a demo invoice.', function (state) {
          find(state, 'patients', data.patientId);
          if (!Array.isArray(data.items) || !data.items.length || data.items.length > 100) throw new Error('Add between 1 and 100 invoice items.');
          var totalPaise = 0;
          var items = data.items.map(function (item) {
            item = item || {};
            var name = text(item.name, 'Item name', true, 200);
            var qty = Number(item.qty);
            var price = Number(item.price);
            if (item.qty === '' || item.qty === null || item.qty === undefined || !Number.isSafeInteger(qty) || qty <= 0) throw new Error('Item quantities must be positive whole numbers.');
            if (item.price === '' || item.price === null || item.price === undefined || !Number.isFinite(price) || price < 0 || Math.abs(price * 100 - Math.round(price * 100)) > 0.000001) throw new Error('Item prices must be nonnegative amounts with at most two decimal places.');
            var paise = Math.round(price * 100);
            if (!Number.isSafeInteger(paise * qty)) throw new Error('Invoice amount is too large.');
            totalPaise += paise * qty;
            if (!Number.isSafeInteger(totalPaise)) throw new Error('Invoice amount is too large.');
            return { name: name, qty: qty, price: price };
          });
          var invoice = { id: id('inv'), patientId: data.patientId, date: today(), items: items, total: totalPaise / 100, status: 'Pending' };
          state.invoices.unshift(invoice);
          notify(state, 'Invoice created', find(state, 'patients', invoice.patientId).name + ' · INR ' + invoice.total.toFixed(2) + ' awaiting simulated payment.');
          return invoice;
        });
      },
      payInvoice: function (invoiceId) {
        return commit('payInvoice', 'Recorded a simulated invoice payment (no real money).', function (state) {
          var invoice = find(state, 'invoices', invoiceId);
          if (invoice.status === 'Paid') throw new Error('This invoice is already paid.');
          invoice.status = 'Paid';
          notify(state, 'Demo payment recorded', find(state, 'patients', invoice.patientId).name + ' · INR ' + invoice.total.toFixed(2) + '. No real payment was processed.');
          return invoice;
        });
      },
      markNotificationsRead: function () {
        return commit('markNotificationsRead', 'Marked demo notifications as read.', function (state) { state.notifications.forEach(function (n) { n.read = true; }); return state.notifications; });
      },
      reset: function () {
        var next = seed();
        persist(next);
        current = next;
        return copy(current);
      },
      exportData: function () {
        allowed('exportData');
        return JSON.stringify(current, null, 2);
      }
    };
  }
  createHMSStore.today = today;
  createHMSStore.ROLES = ROLES.slice();
  createHMSStore.APPOINTMENT_STATUSES = APPOINTMENT_STATUSES.slice();
  createHMSStore.STORAGE_KEY = STORAGE_KEY;
  return createHMSStore;
});

    <div class="dashboard-grid"><section class="card"><div class="card-header"><div><h2 class="card-title">Today’s appointments</h2><p class="card-subtitle">${appointments.length} visits on the schedule</p></div>${routes[s.role].includes('appointments')?button('View schedule','nav','data-view="appointments"','ghost','arrow'):''}</div>${appointmentTable(appointments.slice(0,5),true)}</section>
    <section class="card"><div class="card-header"><div><h2 class="card-title">Your care team</h2><p class="card-subtitle">Specialists in this demo</p></div><span class="badge teal">${s.doctors.length} doctors</span></div><div class="doctor-list">${s.doctors.map(d=>`<div class="doctor-row"><span class="doctor-avatar">${icon('stethoscope')}</span><div><strong>${esc(d.name)}</strong><small>${esc(d.department)}</small></div><span class="doctor-visits">${s.appointments.filter(a=>a.doctorId===d.id&&a.date===dateToday()&&a.status!=='Cancelled').length} visits</span></div>`).join('')}</div></section></div>

  function toolbar(placeholder,statuses=[]) {return `<div class="toolbar"><label class="search-field">${icon('search')}<input id="search-input" type="search" value="${esc(search)}" placeholder="${placeholder}" aria-label="${placeholder}"></label>${statuses.length?`<div class="filters">${statuses.map(s=>`<button class="filter-chip ${filter===s?'active':''}" data-action="filter" data-value="${s}">${s}</button>`).join('')}</div>`:''}</div>`;}
  function appointmentTable(rows,compact=false) {
    if(!rows.length) return empty('No appointments to show','Book a visit to start the patient journey.');

  }
  function patientsView() {
    const ps=own(store.state.patients).filter(p=>`${p.name} ${p.id} ${p.phone}`.toLowerCase().includes(search.toLowerCase()));

  }
  function appointmentsView() {
    const rows=own(store.state.appointments).filter(a=>(filter==='All'||a.status===filter)&&`${patient(a.patientId).name} ${doctor(a.doctorId).name} ${a.reason}`.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  function recordsView() {

  function labsView() {

  }
  function pharmacyView() {
    const rows=store.state.inventory.filter(i=>i.name.toLowerCase().includes(search.toLowerCase())&&(filter!=='Low stock'||i.stock<=i.threshold));

  }
  function billingView() {
    const invoices=own(store.state.invoices), rows=invoices.filter(i=>(filter==='All'||i.status===filter)&&`${patient(i.patientId).name} ${i.id}`.toLowerCase().includes(search.toLowerCase()));

  }
  function activityList(limit=50) {const rows=store.state.audit.slice(0,limit);return `<div class="activity-list">${rows.map(a=>`<div class="activity-row"><span class="activity-dot"></span><div><strong>${esc(a.action)}</strong><small>${esc(a.role)} · ${new Date(a.time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<p class="muted">Activity will appear as you explore the demo.</p>'}</div>`;}
  function reportsView() {
    const s=store.state, counts=s.doctors.map(d=>[d.department,s.appointments.filter(a=>a.doctorId===d.id&&a.status!=='Cancelled').length]);
    return `${stats([['users','Patient records',s.patients.length,'Shared across modules'],['calendar','Completed visits',s.appointments.filter(a=>a.status==='Completed').length,'Completed appointment records'],['flask','Lab turnaround',`${s.labs.filter(l=>l.status==='Completed').length} / ${s.labs.length}`,'Results completed / tests ordered'],['shield','Activity events',s.audit.length,'Actions recorded in this browser']])}<div class="dashboard-grid"><section class="card"><div class="card-header"><div><h2 class="card-title">Appointments by department</h2><p class="card-subtitle">All dates · excludes cancelled visits</p></div></div><div class="card-body chart-bars">${counts.map(([label,n])=>`<div class="chart-bar"><div class="chart-label"><span>${esc(label)}</span><strong>${n}</strong></div><div class="chart-track"><div style="width:${n/Math.max(...counts.map(x=>x[1]),1)*100}%"></div></div></div>`).join('')}</div></section><section class="card"><div class="card-header"><h2 class="card-title">Demo controls</h2></div><div class="card-body"><p>Repeat your presentation with a fresh set of sample records, or export the current demo as JSON.</p><div class="control-buttons">${button('Export demo data','export','','secondary','download')}${button('Reset sample data','reset-confirm','','ghost','reset')}</div><div class="note-block"><strong>Prototype architecture</strong><p>Browser interface → JavaScript business rules → local browser storage. The SRS proposes a backend API and relational database for a production system.</p></div></div></section></div><section class="card"><div class="card-header"><div><h2 class="card-title">Activity log</h2><p class="card-subtitle">Recent actions across registration, scheduling, care, and billing</p></div><span class="badge teal">${s.audit.length} events</span></div>${activityList()}</section>`;

  function tourBar() {const step=tourSteps[tour];return `<aside class="tour-bar" aria-label="Class presentation walkthrough"><span class="tour-step-num">${tour+1}<small>/ ${tourSteps.length}</small></span><div class="tour-content"><strong>${step[1]}</strong><p>${step[2]}</p></div><div class="tour-actions">${tour?button('Back','tour-back','','ghost'):''}${button(tour===tourSteps.length-1?'Finish demo':'Next step','tour-next','','primary','arrow')}<button class="icon-button" data-action="fullscreen" aria-label="Toggle full screen">${icon('expand')}</button><button class="icon-button" data-action="end-tour" aria-label="Close walkthrough">${icon('close')}</button></div></aside>`;}
  function toast(message,error=false) {const t=document.createElement('div');t.className='toast '+(error?'error':'success');t.setAttribute('role',error?'alert':'status');t.innerHTML=icon(error?'info':'check')+`<span>${esc(message)}</span>`;$('#toast-root').append(t);setTimeout(()=>t.remove(),5500);}
  function navigate(v) {if(!routes[store.state.role].includes(v)) return toast('This demo role does not have access to that module.',true);view=v;search='';filter='All';render();window.scrollTo({top:0,behavior:'smooth'});}
  function openModal(title,content,footer='',type='detail',id='') {
    lastFocus=document.activeElement;modal={type,id};
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${content}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;
    document.body.classList.add('modal-open');
    setTimeout(()=>($('.modal input:not([type="hidden"]), .modal select, .modal textarea')||$('.modal')).focus(),30);
  }
  function closeModal() {$('#modal-root').innerHTML='';modal=null;document.body.classList.remove('modal-open','printing');if(lastFocus?.isConnected)lastFocus.focus();}
  function field(label,name,type='text',value='',extra='',full=false) {return `<label class="field ${full?'full':''}"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
  function selectField(label,name,options,full=false) {return `<label class="field ${full?'full':''}"><span>${label}</span><select name="${name}" required>${options}</select></label>`;}
  function area(label,name,value='',required=false) {return `<label class="field full"><span>${label}</span><textarea name="${name}" rows="3" ${required?'required':''}>${esc(value)}</textarea></label>`;}
  function form(title,fields,type,id='',submit='Save',helper='') {openModal(title,`<form id="action-form"><div class="form-grid">${fields}</div>${helper?`<p class="form-hint">${helper}</p>`:''}<div class="form-error" id="form-error" role="alert" hidden></div></form>`,`${button('Cancel','close-modal','','ghost')}${['patient','record','lab-result'].includes(type)?button('Use sample details','fill-sample','','secondary'):''}<button class="btn btn-primary" type="submit" form="action-form">${icon('check')}${submit}</button>`,type,id);}
  function patientForm() {form('Register a new patient',field('Full name','name','text','','required minlength="2" placeholder="e.g. Ishaan Verma"',true)+field('Age','age','number','','required min="0" max="120"')+selectField('Gender','gender','<option>Male</option><option>Female</option><option>Other</option>')+field('Phone number','phone','tel','','required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number"')+selectField('Blood group','blood',['Unknown','A+','A-','B+','B-','O+','O-','AB+','AB-'].map(x=>`<option>${x}</option>`).join(''))+area('Medical history / allergies','history'),'patient','','Register patient','Use fictional information for this academic demo.');}
  function appointmentForm(id='') {const a=store.state.appointments.find(a=>a.id===id);form(a?'Reschedule appointment':'Book an appointment',!a?selectField('Patient','patientId',patientOptions(),true):`<div class="field full"><span>Patient</span><strong>${esc(patient(a.patientId).name)}</strong></div>`+'' ,a?'reschedule':'appointment',id);const f=$('#action-form .form-grid');if(!a){}f.insertAdjacentHTML('beforeend',selectField('Doctor','doctorId',doctorOptions(a?.doctorId),true)+field('Visit date','date','date',a?.date||dateToday(),`required min="${dateToday()}"`)+field('Time','time','time',a?.time||'14:30','required min="08:00" max="20:00" step="1800"')+(!a?field('Reason for visit','reason','text','','required placeholder="e.g. Routine consultation"',true):''));$('.modal-footer button[type="submit"]').textContent=a?'Save new slot':'Confirm appointment';}
  function recordForm() {form('Record a consultation',selectField('Patient','patientId',patientOptions(),true)+selectField('Attending doctor','doctorId',doctorOptions(),true)+field('Diagnosis / visit summary','diagnosis','text','','required',true)+area('Treatment / consultation notes','treatment','',true)+area('Prescription / care instructions','prescription'),'record','','Save consultation','Sample clinical notes only; this prototype provides no medical advice.');}
  function labForm() {form('Order a laboratory test',selectField('Patient','patientId',patientOptions(),true)+selectField('Test','test',['Complete blood count (CBC)','Blood glucose','Lipid profile','Thyroid profile','Urine analysis','Liver function test'].map(x=>`<option>${x}</option>`).join(''),true),'lab','','Create test order','The test is linked to the patient record and appears in the technician’s queue.');}
  function invoiceForm() {form('Create an itemized invoice',selectField('Patient','patientId',patientOptions(),true)+`<div class="field full invoice-items"><div class="invoice-row invoice-labels"><span>Service / item</span><span>Qty</span><span>Rate (₹)</span><span></span></div><div id="invoice-rows"></div>${button('Add line item','add-line','','ghost','plus')}</div><div class="invoice-total field full"><span>Invoice total</span><strong id="invoice-preview">₹0</strong></div>`,'invoice','','Create invoice','This demo records billing only. It does not process real payments.');addInvoiceLine('Consultation',1,500);addInvoiceLine('Laboratory test',1,350);updateInvoicePreview();}
  function addInvoiceLine(name='',qty=1,price=0) {$('#invoice-rows').insertAdjacentHTML('beforeend',`<div class="invoice-row"><input aria-label="Line item description" class="line-name" placeholder="Service / medication" value="${esc(name)}" required><input aria-label="Quantity" class="line-qty" type="number" value="${qty}" min="1" step="1" required><input aria-label="Unit price" class="line-price" type="number" value="${price}" min="0" max="1000000" step="0.01" required><button class="icon-button" type="button" data-action="remove-line" aria-label="Remove line item">${icon('close')}</button></div>`);}
  function invoiceItems() {return [...document.querySelectorAll('#invoice-rows .invoice-row')].map(r=>({name:$('.line-name',r).value,qty:Number($('.line-qty',r).value),price:Number($('.line-price',r).value)}));}
  function updateInvoicePreview() {const el=$('#invoice-preview');if(el)el.textContent=money(invoiceItems().reduce((n,i)=>n+i.qty*i.price,0));}
  function showPatient(id) {const p=patient(id);selectedPatient=id;const s=store.state;openModal(`${esc(p.name)} · Patient record`,`${person(p,`${p.id.toUpperCase()} · ${p.age} years · ${p.gender}`)}<div class="detail-grid"><div class="detail-item"><span class="detail-label">Phone</span><strong>${esc(p.phone)}</strong></div><div class="detail-item"><span class="detail-label">Blood group</span><strong>${esc(p.blood)}</strong></div></div><div class="note-block"><strong>History & allergies</strong><p>${esc(p.history||'None recorded.')}</p></div><h3>Consultations</h3>${s.records.filter(r=>r.patientId===id).map(r=>`<div class="timeline-item"><strong>${esc(r.diagnosis)}</strong><small>${prettyDate(r.date)} · ${esc(doctor(r.doctorId).name)}</small><p>${esc(r.treatment)}</p><p class="muted">${esc(r.prescription)}</p></div>`).join('')||'<p class="muted">No consultations recorded.</p>'}<h3>Laboratory results</h3>${s.labs.filter(l=>l.patientId===id).map(l=>`<div class="timeline-item"><strong>${esc(l.test)} ${badge(l.status)}</strong><p>${esc(l.result||'Awaiting result')}</p></div>`).join('')||'<p class="muted">No tests ordered.</p>'}`,`${has('bookAppointment')?button('Book appointment','appointment-form','','primary','calendar'):''}${button('Close','close-modal','','secondary')}`);}
  function showAppointment(id) {const a=store.state.appointments.find(x=>x.id===id);if(!a)return;const active=!['Completed','Cancelled'].includes(a.status),isPatient=store.state.role==='Patient';const next={'Confirmed':'Checked in','Checked in':'In consultation','In consultation':'Completed'}[a.status];openModal('Appointment details',`${person(patient(a.patientId))}<div class="detail-grid">${[['Doctor',doctor(a.doctorId).name],['Department',doctor(a.doctorId).department],['Date',prettyDate(a.date)],['Time',time(a.time)],['Reason',a.reason||'Consultation']].map(([k,v])=>`<div class="detail-item"><span class="detail-label">${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div>${badge(a.status)}`,`${active&&has('rescheduleAppointment')?button('Reschedule','reschedule-form',`data-id="${id}"`,'secondary'):''}${active&&has('setAppointmentStatus')?button('Cancel visit','appointment-status',`data-id="${id}" data-status="Cancelled"`,'ghost'):''}${next&&has('setAppointmentStatus')&&!isPatient?button(next==='Checked in'?'Check in':next==='In consultation'?'Start consultation':'Complete visit','appointment-status',`data-id="${id}" data-status="${next}"`,'primary','check'):''}`);}
  function showInvoice(id) {const i=store.state.invoices.find(x=>x.id===id);if(!i)return;openModal(i.status==='Paid'?'Payment receipt':'Invoice',`<article class="receipt"><div class="receipt-head"><div><h2>careflow.</h2><p>Aarogya Hospital · Classroom demo</p></div>${badge(i.status)}</div><div class="detail-grid"><div><span class="detail-label">Billed to</span><strong>${esc(patient(i.patientId).name)}</strong><p>${esc(i.patientId.toUpperCase())}</p></div><div><span class="detail-label">Invoice #${esc(i.id.toUpperCase())}</span><strong>${prettyDate(i.date)}</strong></div></div><table class="receipt-lines"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><div class="invoice-total"><span>Total ${i.status==='Paid'?'paid':'due'}</span><strong>${money(i.total)}</strong></div><p class="form-hint">DEMO ${i.status==='Paid'?'RECEIPT':'INVOICE'} · No real payment processed. Fictional patient data.</p></article>`,`${button('Print / save PDF','print','','secondary','print')}${i.status!=='Paid'&&has('payInvoice')?button('Record demo payment','pay-invoice',`data-id="${id}"`,'primary','check'):button('Close','close-modal','','secondary')}`);}
  function showNotifications() {const ns=store.state.role==='Administrator'?store.state.notifications:[];openModal('Workspace notifications',ns.length?`<div class="activity-list">${ns.slice(0,20).map(n=>`<div class="activity-row"><span class="activity-dot"></span><div><strong>${esc(n.title)}</strong><p>${esc(n.detail)}</p><small>${prettyDate(n.time)}</small></div></div>`).join('')}</div>`:empty('No notifications in this view','Switch to Administrator to see workspace-wide demo events.'),button('Close','close-modal','','secondary'));store.markNotificationsRead();render();}
  async function fullscreen() {try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Use the browser’s full-screen button or F11 to fill the smart board.');}}
  function about() {openModal('Hospital Management System',`<div class="eyebrow">MINI PROJECT · REQUIREMENTS TO WORKING DEMO</div><h3>Digitize care. Streamline workflows. Serve patients better.</h3><p>Prepared for classroom presentation by <strong>Rajath Lunawat (C202)</strong>, based on the uploaded SRS and presentation.</p><div class="note-block"><strong>What works here</strong><p>Patient registration, conflict checks, consultation notes, lab orders/results, stock changes, itemized invoices, demo payments, role views, activity logs, and data export.</p></div><div class="note-block"><strong>Prototype boundaries</strong><p>All patients are fictional. Data is stored only in this browser. Role switching demonstrates interfaces; it is not secure server authentication. Payments and notifications are simulated. A production system needs a backend, database, secure authentication, and operational safeguards.</p></div><p>Start the class walkthrough for a guided patient journey. Presentation mode enlarges text and controls. Use full screen for your smart board.</p>`,button('Start class walkthrough','start-tour','','primary','screen'));}
  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action,id=el.dataset.id;
    try {
      if(a==='nav')navigate(el.dataset.view);
      else if(a==='filter'){filter=el.dataset.value;render();}
      else if(a==='close-modal')closeModal();
      else if(a==='patient-form'){closeModal();patientForm();}
      else if(a==='patient-detail')showPatient(id);
      else if(a==='appointment-form'){closeModal();appointmentForm();}
      else if(a==='appointment-detail')showAppointment(id);
      else if(a==='reschedule-form')appointmentForm(id);
      else if(a==='appointment-status'){store.setAppointmentStatus(id,el.dataset.status);closeModal();render();toast('Appointment '+el.dataset.status.toLowerCase()+'.');}
      else if(a==='record-form')recordForm();
      else if(a==='lab-form')labForm();
      else if(a==='lab-result'){const l=store.state.labs.find(x=>x.id===id);form('Record laboratory result',`<div class="field full">${person(patient(l.patientId),l.test)}</div>`+area('Result / technician notes','result','',true),'lab-result',id,'Save result');}
      else if(a==='lab-detail'){const l=store.state.labs.find(x=>x.id===id);openModal('Laboratory report',`${person(patient(l.patientId))}<h3>${esc(l.test)}</h3>${badge(l.status)}<div class="note-block"><strong>Result</strong><p>${esc(l.result)}</p></div><p class="form-hint">Fictional demonstration result · not a clinical report</p>`,button('Close','close-modal','','secondary'));}
      else if(a==='stock-form'){const i=store.state.inventory.find(x=>x.id===id);form(el.dataset.mode==='add'?'Restock inventory':'Dispense inventory',`<div class="field full"><strong>${esc(i.name)}</strong><p>${i.stock} units currently available</p></div>`+field('Number of units','units','number',10,`required min="1" step="1" ${el.dataset.mode==='remove'?`max="${i.stock}"`:''}`)+`<input name="mode" type="hidden" value="${el.dataset.mode}">`,'stock',id,'Update stock');}
      else if(a==='invoice-form')invoiceForm();
      else if(a==='add-line'){addInvoiceLine();updateInvoicePreview();}
      else if(a==='remove-line'){if(document.querySelectorAll('#invoice-rows .invoice-row').length>1){el.closest('.invoice-row').remove();updateInvoicePreview();}else toast('Keep at least one line item.',true);}
      else if(a==='invoice-detail')showInvoice(id);
      else if(a==='pay-invoice'){store.payInvoice(id);render();showInvoice(id);toast('Demo payment recorded. Receipt is ready.');}
      else if(a==='print'){document.body.classList.add('printing');window.print();document.body.classList.remove('printing');}
      else if(a==='notifications')showNotifications();
      else if(a==='about')about();
      else if(a==='present'){presenting=!presenting;if(!presenting)tour=-1;render();if(presenting)toast('Presentation mode on. Use “Start class walkthrough” for guided steps.');}
      else if(a==='start-tour'){closeModal();store.setRole('Administrator');presenting=true;tour=0;navigate('dashboard');}
      else if(a==='tour-next'){if(tour===tourSteps.length-1){tour=-1;render();toast('Demo complete! Use Reports → Reset sample data to rehearse again.');}else{tour++;navigate(tourSteps[tour][0]);}}
      else if(a==='tour-back'){tour=Math.max(0,tour-1);navigate(tourSteps[tour][0]);}
      else if(a==='end-tour'){tour=-1;render();}
      else if(a==='fullscreen')await fullscreen();
      else if(a==='reset-confirm')openModal('Reset the classroom demo?',`<p>This will replace changes in this browser with the original fictional sample records. Export your demo data first if you want to keep it.</p>`,button('Keep my changes','close-modal','','secondary')+button('Reset sample data','reset','','danger','reset'));
      else if(a==='reset'){store.reset();selectedPatient='p1';closeModal();navigate('dashboard');toast('Sample data restored. Ready for a fresh presentation.');}
      else if(a==='export'){const blob=new Blob([store.exportData()],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='careflow-demo-data.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo data exported as JSON.');}
      else if(a==='fill-sample')fillSample();
    }catch(err){toast(err.message,true);}
  });
  function fillSample() {const f=$('#action-form');let values={};if(modal.type==='patient'){const n=store.state.patients.length+1;values={name:'Ishaan Verma',age:26,gender:'Male',phone:'98765'+String(n).padStart(5,'0'),blood:'B+',history:'No known allergies. Routine wellness visit.'};}else if(modal.type==='record'){values={diagnosis:'Routine wellness consultation',treatment:'History reviewed. General wellness discussion and follow-up planned.',prescription:'Demonstration note: routine follow-up and patient education.'};}else if(modal.type==='lab-result'){values={result:'Sample result: report reviewed; values recorded within the demonstration reference range. This is fictional test data.'};}Object.entries(values).forEach(([key,value])=>{if(f.elements[key])f.elements[key].value=value;});}
  document.addEventListener('submit',e=>{
    if(e.target.id!=='action-form')return;e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));
    try {let result,message='Saved successfully.';const type=modal.type;
      if(type==='patient'){data.age=Number(data.age);result=store.addPatient(data);selectedPatient=result.id;message='Patient registered. Ready to book an appointment.';}
      else if(type==='appointment'){result=store.bookAppointment(data);message='Appointment confirmed. The doctor’s schedule is updated.';}
      else if(type==='reschedule'){store.rescheduleAppointment(modal.id,data);message='Appointment moved to the new slot.';}
      else if(type==='record'){store.addRecord({...data,date:dateToday()});message='Consultation saved to the patient record.';}
      else if(type==='lab'){store.orderLab(data);message='Lab test ordered. The technician’s queue is updated.';}
      else if(type==='lab-result'){store.completeLab(modal.id,data.result);message='Lab result saved and linked to the patient record.';}
      else if(type==='stock'){store.adjustStock(modal.id,Number(data.units)*(data.mode==='remove'?-1:1));message='Inventory updated.';}
      else if(type==='invoice'){result=store.createInvoice({patientId:data.patientId,items:invoiceItems()});message='Itemized invoice created.';}
      closeModal();render();toast(message);if(type==='invoice')showInvoice(result.id);
    }catch(err){const error=$('#form-error');error.hidden=false;error.textContent=err.message;error.scrollIntoView({block:'nearest'});}
  });
  document.addEventListener('change',e=>{if(e.target.id==='role-select'){try{store.setRole(e.target.value);tour=-1;closeModal();navigate('dashboard');toast(`${e.target.value} demo view selected.`);}catch(err){toast(err.message,true);}}});
  document.addEventListener('input',e=>{if(e.target.id==='search-input'){search=e.target.value;const pos=e.target.selectionStart;render();const input=$('#search-input');input.focus();input.setSelectionRange(pos,pos);}if(e.target.closest('#invoice-rows'))updateInvoicePreview();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Tab'&&modal){const focusable=[...document.querySelectorAll('.modal button, .modal input:not([type="hidden"]), .modal select, .modal textarea, .modal a')].filter(x=>!x.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  render();
})();

</script>
</body>
